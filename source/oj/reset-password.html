<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重置密码 - xuanoj</title>
    <link rel="icon" href="https://hhxpoint.github.io/img/photo.jpg" type="image/jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50, #43a047);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #4CAF50;
        }
        
        .password-strength {
            margin-top: 8px;
        }
        
        .strength-bar {
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        
        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background-color 0.3s;
            border-radius: 2px;
        }
        
        .strength-fill.weak { width: 25%; background-color: #f44336; }
        .strength-fill.fair { width: 50%; background-color: #ff9800; }
        .strength-fill.good { width: 75%; background-color: #4caf50; }
        .strength-fill.strong { width: 100%; background-color: #2e7d32; }
        
        .strength-text {
            font-size: 12px;
            color: #666;
            min-height: 16px;
        }
        
        .password-match {
            font-size: 12px;
            margin-top: 4px;
            min-height: 16px;
        }
        
        .password-match.match { color: #4caf50; }
        .password-match.no-match { color: #f44336; }
        
        .form-error {
            color: #f44336;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        
        .form-error.show {
            display: block;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4CAF50, #43a047);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .footer {
            text-align: center;
            padding: 20px 30px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
        }
        
        .footer a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 14px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .success-message {
            text-align: center;
            padding: 40px 30px;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        
        .success-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }
        
        .success-message-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .token-error {
            text-align: center;
            padding: 40px 30px;
            color: #f44336;
        }
        
        .token-error-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .token-error-title {
            font-size: 20px;
            margin-bottom: 12px;
        }
        
        .token-error-message {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">xuanoj</div>
            <div class="subtitle">在线编程平台</div>
        </div>
        
        <div class="content" id="formContent">
            <div class="description">
                请输入您的新密码。密码要求至少8个字符，包含大小写字母、数字和特殊字符。
            </div>
            
            <form id="resetPasswordForm" onsubmit="return handleSubmit(event)">
                <div class="form-group">
                    <label for="newPassword">新密码</label>
                    <input type="password" id="newPassword" placeholder="至少8个字符，包含大小写字母、数字和特殊字符" required oninput="checkPasswordStrength()">
                    <div class="password-strength" id="passwordStrength">
                        <div class="strength-bar">
                            <div class="strength-fill" id="strengthFill"></div>
                        </div>
                        <div class="strength-text" id="strengthText">密码强度</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">确认新密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入新密码" required oninput="checkPasswordMatch()">
                    <div class="password-match" id="passwordMatch"></div>
                </div>
                
                <div class="form-error" id="formError"></div>
                
                <button type="submit" class="btn-submit" id="submitBtn">
                    重置密码
                </button>
            </form>
        </div>
        
        <div class="content success-message" id="successMessage" style="display: none;">
            <div class="success-icon">✓</div>
            <div class="success-title">密码重置成功</div>
            <div class="success-message-text">
                您的密码已成功重置。<br>
                现在可以使用新密码登录。
            </div>
        </div>
        
        <div class="content token-error" id="tokenError" style="display: none;">
            <div class="token-error-icon">⚠️</div>
            <div class="token-error-title">链接无效或已过期</div>
            <div class="token-error-message">
                此密码重置链接无效或已过期。<br>
                请重新申请密码重置。
            </div>
        </div>
        
        <div class="footer">
            <a href="/oj/index.html">返回登录</a>
        </div>
    </div>

    <script>
        // 从URL获取参数
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                token: params.get('token'),
                username: params.get('username')
            };
        }
        
        // 页面加载时检查token
        document.addEventListener('DOMContentLoaded', function() {
            const { token } = getUrlParams();
            if (!token) {
                document.getElementById('formContent').style.display = 'none';
                document.getElementById('tokenError').style.display = 'block';
            }
        });
        
        // 检查密码强度
        function checkPasswordStrength() {
            const password = document.getElementById('newPassword').value;
            const strengthFill = document.getElementById('strengthFill');
            const strengthText = document.getElementById('strengthText');
            
            if (!password) {
                strengthFill.className = 'strength-fill';
                strengthText.textContent = '密码强度';
                return;
            }
            
            let score = 0;
            
            // 长度检查
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            
            // 大写字母
            if (/[A-Z]/.test(password)) score++;
            
            // 小写字母
            if (/[a-z]/.test(password)) score++;
            
            // 数字
            if (/[0-9]/.test(password)) score++;
            
            // 特殊字符
            if (/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) score++;
            
            let strengthClass = '';
            let strengthLabel = '';
            
            if (score <= 2) {
                strengthClass = 'weak';
                strengthLabel = '弱';
                strengthText.style.color = '#f44336';
            } else if (score <= 3) {
                strengthClass = 'fair';
                strengthLabel = '中等';
                strengthText.style.color = '#ff9800';
            } else if (score <= 4) {
                strengthClass = 'good';
                strengthLabel = '强';
                strengthText.style.color = '#4caf50';
            } else {
                strengthClass = 'strong';
                strengthLabel = '非常强';
                strengthText.style.color = '#2e7d32';
            }
            
            strengthFill.className = 'strength-fill ' + strengthClass;
            strengthText.textContent = '密码强度: ' + strengthLabel;
            
            // 同时检查密码匹配
            checkPasswordMatch();
        }
        
        // 检查密码匹配
        function checkPasswordMatch() {
            const password = document.getElementById('newPassword').value;
            const confirm = document.getElementById('confirmPassword').value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (!confirm) {
                matchDiv.textContent = '';
                matchDiv.className = 'password-match';
                return;
            }
            
            if (password === confirm) {
                matchDiv.textContent = '✓ 密码匹配';
                matchDiv.className = 'password-match match';
            } else {
                matchDiv.textContent = '✗ 密码不匹配';
                matchDiv.className = 'password-match no-match';
            }
        }
        
        async function handleSubmit(event) {
            event.preventDefault();
            
            const { token } = getUrlParams();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const formError = document.getElementById('formError');
            
            if (!token) {
                formError.textContent = '无效的重置链接';
                formError.classList.add('show');
                return false;
            }
            
            if (!newPassword || !confirmPassword) {
                formError.textContent = '请填写所有字段';
                formError.classList.add('show');
                return false;
            }
            
            // 验证密码强度
            if (newPassword.length < 8) {
                formError.textContent = '密码长度至少8个字符';
                formError.classList.add('show');
                return false;
            }
            
            if (!/[A-Z]/.test(newPassword)) {
                formError.textContent = '密码必须包含至少一个大写字母';
                formError.classList.add('show');
                return false;
            }
            
            if (!/[a-z]/.test(newPassword)) {
                formError.textContent = '密码必须包含至少一个小写字母';
                formError.classList.add('show');
                return false;
            }
            
            if (!/[0-9]/.test(newPassword)) {
                formError.textContent = '密码必须包含至少一个数字';
                formError.classList.add('show');
                return false;
            }
            
            if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(newPassword)) {
                formError.textContent = '密码必须包含至少一个特殊字符';
                formError.classList.add('show');
                return false;
            }
            
            if (newPassword !== confirmPassword) {
                formError.textContent = '两次输入的密码不一致';
                formError.classList.add('show');
                return false;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>重置中...';
            formError.classList.remove('show');
            
            try {
                const res = await fetch('/api/users/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    // 显示成功消息
                    document.getElementById('formContent').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    if (data.message && data.message.includes('过期')) {
                        document.getElementById('formContent').style.display = 'none';
                        document.getElementById('tokenError').style.display = 'block';
                    } else {
                        formError.textContent = data.message || '重置失败，请稍后重试';
                        formError.classList.add('show');
                    }
                }
            } catch (error) {
                formError.textContent = '网络错误，请稍后重试';
                formError.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '重置密码';
            }
            
            return false;
        }
    </script>
</body>
</html>
