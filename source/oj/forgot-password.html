<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - xuanoj</title>
    <link rel="icon" href="https://hhxpoint.github.io/img/photo.jpg" type="image/jpeg">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: linear-gradient(135deg, #4CAF50, #43a047);
            padding: 40px 30px;
            text-align: center;
            color: white;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
            outline: none;
        }
        
        .form-group input:focus {
            border-color: #4CAF50;
        }
        
        .form-error {
            color: #f44336;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }
        
        .form-error.show {
            display: block;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4CAF50, #43a047);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
        }
        
        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        
        .footer {
            text-align: center;
            padding: 20px 30px;
            background: #f5f5f5;
            border-top: 1px solid #e0e0e0;
        }
        
        .footer a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 14px;
        }
        
        .footer a:hover {
            text-decoration: underline;
        }
        
        .success-message {
            text-align: center;
            padding: 40px 30px;
        }
        
        .success-icon {
            width: 80px;
            height: 80px;
            background: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 40px;
        }
        
        .success-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 12px;
        }
        
        .success-message-text {
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">xuanoj</div>
            <div class="subtitle">在线编程平台</div>
        </div>
        
        <div class="content" id="formContent">
            <div class="description">
                请输入您注册时使用的邮箱地址，我们将向您发送密码重置链接。
            </div>
            
            <form id="forgotPasswordForm" onsubmit="return handleSubmit(event)">
                <div class="form-group">
                    <label for="email">邮箱地址</label>
                    <input type="email" id="email" placeholder="请输入您的邮箱" required>
                </div>
                
                <div class="form-error" id="formError"></div>
                
                <button type="submit" class="btn-submit" id="submitBtn">
                    发送重置链接
                </button>
            </form>
        </div>
        
        <div class="content success-message" id="successMessage" style="display: none;">
            <div class="success-icon">✓</div>
            <div class="success-title">邮件已发送</div>
            <div class="success-message-text">
                如果该邮箱已注册，您将收到密码重置邮件。<br>
                请检查您的收件箱（包括垃圾邮件文件夹）。
            </div>
        </div>
        
        <div class="footer">
            <a href="/oj/index.html">返回登录</a>
        </div>
    </div>

    <script>
        async function handleSubmit(event) {
            event.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const formError = document.getElementById('formError');
            
            if (!email) {
                formError.textContent = '请输入邮箱地址';
                formError.classList.add('show');
                return false;
            }
            
            // 验证邮箱格式
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                formError.textContent = '请输入有效的邮箱地址';
                formError.classList.add('show');
                return false;
            }
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span>发送中...';
            formError.classList.remove('show');
            
            try {
                const res = await fetch('/api/users/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                
                const data = await res.json();
                
                if (data.success) {
                    // 显示成功消息
                    document.getElementById('formContent').style.display = 'none';
                    document.getElementById('successMessage').style.display = 'block';
                } else {
                    formError.textContent = data.message || '发送失败，请稍后重试';
                    formError.classList.add('show');
                }
            } catch (error) {
                formError.textContent = '网络错误，请稍后重试';
                formError.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '发送重置链接';
            }
            
            return false;
        }
    </script>
</body>
</html>
